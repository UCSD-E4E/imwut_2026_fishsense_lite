[project]
name = "fishsense_imwut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "ipympl>=0.9.8",
    "matplotlib>=3.10.7",
    "numba>=0.63.1",
    "pandas>=2.3.3",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
fishsense-meta = { git = "https://github.com/UCSD-E4E/fishsense-core.git" }

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.1.1",
]
# The simulation notebooks' dependency, and the ONLY thing here that needs a
# compiler. `fishsense-meta` pulls `fishsense-core`, a maturin/pyo3 Rust
# extension providing `fishsense_core.laser.calibrate_laser` -- the production
# laser fit that `calibration_analysis/` and
# `reconstruction_analysis/calculated_calibration.ipynb` compare estimators
# against. It is NOT a database client: nothing in this repository speaks to the
# database from Python at all, and the cache is re-exported with `psql` against
# the .sql files in `fish_model_analysis/sql/`.
#
# Kept out of the default install because the paper does not need it. Every
# number in PAPER.md comes from the committed CSVs (see
# `fish_model_analysis/data/MANIFEST.md`), so a reader reproducing the results
# needs neither this group nor a toolchain. Deliberately not `dev` either, which
# uv installs by default.
sim = [
    "fishsense-meta",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "fishsense_imwut"
